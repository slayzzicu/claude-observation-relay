<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c10">
<title>Claude Observation</title>
<style>
:root{color-scheme:dark;--bg:#0a0c10;--s1:#11141a;--s2:#171b23;--bd:#252b38;--tx:#e8ebf1;--mt:#8892a5;--ac:#d97757;--er:#ef5b5b}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px}
.card{width:100%;max-width:400px}
.logo{width:48px;height:48px;border-radius:13px;background:var(--s1);border:1px solid var(--bd);display:grid;place-items:center;color:var(--ac);margin-bottom:20px}
.logo svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1{margin:0 0 4px;font-size:22px;font-weight:600}
p.sub{margin:0 0 24px;color:var(--mt)}
form{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:20px}
label{display:block;font-size:13px;color:var(--mt);margin-bottom:8px}
input{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:14px;font:600 22px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.18em;text-align:center;text-transform:uppercase;color:var(--tx);outline:none}
input:focus{border-color:var(--ac)}
button{width:100%;margin-top:14px;background:var(--ac);border:0;border-radius:12px;padding:14px;font-family:inherit;font-weight:600;font-size:15px;color:#fff;cursor:pointer}
button:active{filter:brightness(.92)}
.err{color:var(--er);font-size:13px;margin-top:12px;min-height:0}
.err:empty{display:none}
.help{margin-top:18px;color:var(--mt);font-size:13px}
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></div>
    <h1>Claude Observation</h1>
    <p class="sub">Accède à ton PC depuis n'importe où.</p>
    <form method="post" action="/join" autocomplete="off">
      <label for="code">Code de connexion affiché sur ton PC</label>
      <input id="code" name="code" inputmode="latin" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="9" placeholder="XXXX-XXXX" autofocus>
      <div class="err"><!--ERR--></div>
      <button type="submit">Se connecter</button>
    </form>
    <p class="help">Le code est affiché à l'installation de l'agent sur le PC. Ensuite, une fenêtre te demandera d'autoriser cet appareil sur le PC.</p>
  </div>
</main>
<script>
const c=document.getElementById('code');
c.addEventListener('input',()=>{let v=c.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);c.value=v.length>4?v.slice(0,4)+'-'+v.slice(4):v});
</script>
</body>
</html>
